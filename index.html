<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Hints to crawlers that this is temporary maintenance -->
  <meta name="robots" content="noindex, follow" />
  <title>Luba AI - Under Maintenance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 450px;
      padding: 40px 24px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .emoji {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🙁</div>
    <h1>Squashing Some Bugs</h1>
    <p>Luba AI is temporarily paused for quick bug fixes and system upgrades. We'll be back online tomorrow!</p>
    <div class="badge">Status: 503 Maintenance</div>
  </div>
</body>
</html>
