<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luba AI</title>
    <!-- KaTeX renders LaTeX math (the $...$ / $$...$$ style output Gemini
         writes) as real math symbols instead of raw text with backslashes
         and dollar signs. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --bg: #131314;
            --header: #1e1f20;
            --text: #e3e3e3;
            --bubble-ai: #1e1f20;
            --bubble-user: #282a2c;
            --border: #2d2f31;
            --input-bg: #1e1f20;
            --accent: #ff007f;
        }

        body.light {
            --bg: #f5f5f5;
            --header: #ffffff;
            --text: #1a1a1a;
            --bubble-ai: #ffffff;
            --bubble-user: #e8e8e8;
            --border: #ddd;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* Hide main app until logged in */
        body:not(.logged-in) header,
        body:not(.logged-in) #chat-container,
        body:not(.logged-in) #input-wrapper {
            display: none !important;
        }

        header {
            padding: 12px 16px;
            background-color: var(--header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.45));
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(75deg, #ff007f, #9b51e0, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 4px;
        }

        .header-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--accent);
            background: #444;
        }

        .header-username {
            font-size: 13px;
            font-weight: 600;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            padding: 7px 11px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        body.light .icon-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .icon-btn:hover {
            background: #3c4043;
        }

        .icon-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .icon-btn.active:hover {
            background: #e00070;
        }

        .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .icon-btn:disabled:hover {
            background: #282a2c;
        }

        body.light .icon-btn:hover {
            background: #ddd;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            line-height: 1.55;
            position: relative;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
            background: #444746;
            color: #fff;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user .avatar {
            background-color: #444746;
            color: #fff;
        }

        .ai .avatar {
            background: linear-gradient(135deg, #ff007f, #9b51e0);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .message-body {
            max-width: 85%;
        }

        .content {
            background: var(--bubble-ai);
            padding: 11px 15px;
            border-radius: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }

        .user .content {
            background: var(--bubble-user);
        }

        .content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
            cursor: pointer;
        }

        .content .katex {
            color: var(--text);
        }

        .content .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 0;
            margin: 6px 0;
        }

        /* --- Fullscreen image lightbox --- */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 20px;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-overlay img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 301;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lightbox-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            text-align: center;
            padding: 0 20px;
        }

        .generated-image-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 8px;
        }

        .generated-image-wrap img {
            margin-top: 0;
        }

        .image-error-box {
            background: rgba(255, 0, 127, 0.08);
            border: 1px dashed var(--border);
            border-radius: 10px;
            padding: 14px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .retry-image-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
        }

        body.light .retry-image-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .retry-image-btn:hover {
            background: #3c4043;
        }

        .timestamp {
            font-size: 11px;
            opacity: 0.55;
            margin-top: 4px;
            padding-left: 4px;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 8px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .ai .content:hover .copy-btn {
            opacity: 1;
        }

        #input-wrapper {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #image-preview {
            display: none;
            position: relative;
            margin-bottom: 4px;
            max-width: 180px;
        }

        #image-preview img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        #remove-image {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }

        #input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 15px;
            border-radius: 24px;
            outline: none;
            resize: none;
            height: 50px;
            font-size: 1rem;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .action-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        body.light .action-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .action-btn:hover {
            background: #3c4043;
        }

        .send-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0 18px;
            height: 46px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            min-width: 80px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #e00070;
        }

        .send-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        /* --- Improved thinking indicator --- */
        .thinking-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
        }

        .thinking-text {
            font-size: 14px;
            opacity: 0.85;
            letter-spacing: 0.2px;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: thinkBounce 1.3s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.18s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.36s; }

        @keyframes thinkBounce {
            0%, 70%, 100% { transform: translateY(0); opacity: 0.45; }
            35% { transform: translateY(-5px); opacity: 1; }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--header);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 16px;
            width: 92%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings-row span {
            font-size: 14px;
            font-weight: bold;
        }

        .modal input, .modal textarea, .modal select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .modal textarea {
            height: 90px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .save-btn {
            background: var(--accent);
            color: white;
        }

        .cancel-btn {
            background: #555;
            color: white;
        }

        .danger-btn {
            background: #b33;
            color: white;
            width: 100%;
            margin-top: 8px;
        }

        /* --- Saved chats panel --- */
        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .saved-chats-close {
            position: static;
            background: rgba(255, 255, 255, 0.08);
            width: 34px;
            height: 34px;
            font-size: 20px;
        }

        .save-chat-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .save-chat-row input {
            flex: 1;
            margin-bottom: 0;
        }

        .save-chat-row .save-btn {
            white-space: nowrap;
            padding: 0 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        #saved-chats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .saved-chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bubble-user);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
        }

        .saved-chat-item:hover {
            border-color: var(--accent);
        }

        .saved-chat-name {
            font-size: 14px;
            font-weight: bold;
            word-break: break-word;
        }

        .saved-chat-meta {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .saved-chat-delete {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 4px;
            color: var(--text);
        }

        .saved-chats-empty {
            font-size: 13px;
            opacity: 0.6;
            text-align: center;
            padding: 16px 0;
        }

        /* ========== AUTH SCREEN ========== */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 20px;
        }

        body.logged-in #auth-screen {
            display: none;
        }

        .auth-card {
            background: var(--header);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }

        .auth-logo-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .auth-logo-row .logo-icon {
            width: 52px;
            height: 52px;
        }

        .auth-logo-row .logo {
            font-size: 1.6rem;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .auth-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-form label {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .auth-form input,
        .auth-form select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .auth-form input:focus,
        .auth-form select:focus {
            border-color: var(--accent);
        }

        .auth-error {
            color: #ff6b8a;
            font-size: 13px;
            margin-bottom: 10px;
            min-height: 18px;
        }

        /* Live username status (Roblox-style) */
        .username-status {
            font-size: 12px;
            min-height: 18px;
            margin-top: -8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }
        .username-status.empty { color: transparent; }
        .username-status.checking { color: #aaa; }
        .username-status.ok { color: #3dd68c; }
        .username-status.bad { color: #ff6b8a; }
        .username-status .status-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        .auth-form input.username-ok {
            border-color: #3dd68c;
        }
        .auth-form input.username-bad {
            border-color: #ff6b8a;
        }

        .auth-submit {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s;
        }

        .auth-submit:hover {
            background: #e00070;
        }

        .auth-submit:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .gender-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .gender-option {
            flex: 1;
            padding: 11px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .gender-option.selected {
            background: rgba(255, 0, 127, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Account section in settings */
        .account-section {
            border-top: 1px solid var(--border);
            margin-top: 18px;
            padding-top: 16px;
        }

        .account-section h4 {
            font-size: 14px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .profile-pic-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .profile-pic-preview {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            background: #444;
        }

        .profile-pic-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .small-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }

        body.light .small-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .username-change-hint {
            font-size: 12px;
            opacity: 0.65;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        .username-locked {
            opacity: 0.55;
            pointer-events: none;
        }
    </style>
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo-row">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="lubaGradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff007f"/>
                        <stop offset="50%" stop-color="#9b51e0"/>
                        <stop offset="100%" stop-color="#00d2ff"/>
                    </linearGradient>
                    <filter id="glowAuth">
                        <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <circle cx="50" cy="50" r="38" stroke="url(#lubaGradAuth)" stroke-width="3.5" fill="none" opacity="0.7"/>
                <path d="M32 28 L32 68 Q32 74 38 74 L62 74 Q68 74 68 68 L68 58 Q68 52 62 52 L48 52 L48 28 Q48 22 42 22 L38 22 Q32 22 32 28 Z"
                      fill="url(#lubaGradAuth)" filter="url(#glowAuth)"/>
                <circle cx="50" cy="50" r="7" fill="url(#lubaGradAuth)" filter="url(#glowAuth)"/>
            </svg>
            <div class="logo">Luba AI</div>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Log in</button>
            <button class="auth-tab" id="tab-signup">Sign up</button>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form active" id="login-form" autocomplete="on">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" placeholder="Your username" autocomplete="username" required>
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" required>
            <div class="auth-error" id="login-error"></div>
            <button type="submit" class="auth-submit" id="login-submit">Log in</button>
        </form>

        <!-- SIGN UP FORM -->
        <form class="auth-form" id="signup-form" autocomplete="on">
            <label for="signup-username">Username</label>

<script>
    // ============================================================
    // DOM refs
    // ============================================================
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const systemPromptInput = document.getElementById('system-prompt-input');
    const clearChatBtn = document.getElementById('clear-chat-btn');
    const photoBtn = document.getElementById('photo-btn');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');
    const removeImageBtn = document.getElementById('remove-image');
    const themeBtn = document.getElementById('theme-btn');
    const exportBtn = document.getElementById('export-btn');
    const micBtn = document.getElementById('mic-btn');
    const studyModeBtn = document.getElementById('study-mode-btn');

    // Auth
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const loginError = document.getElementById('login-error');
    const signupError = document.getElementById('signup-error');
    const genderBoy = document.getElementById('gender-boy');
    const genderGirl = document.getElementById('gender-girl');

    // Settings account
    const settingsAvatarPreview = document.getElementById('settings-avatar-preview');
    const changeAvatarBtn = document.getElementById('change-avatar-btn');
    const removeAvatarBtn = document.getElementById('remove-avatar-btn');
    const avatarInput = document.getElementById('avatar-input');
    const settingsUsername = document.getElementById('settings-username');
    const usernameChangeHint = document.getElementById('username-change-hint');
    const logoutBtn = document.getElementById('logout-btn');

    // ============================================================
    // State
    // ============================================================
    let currentUser = null;          // full user object
    let chatHistory = [];
    let selectedImageBase64 = null;
    let isListening = false;
    let isStudyModeOn = false;
    let pendingAvatarBase64 = null;  // temporary while editing in settings

    // ---- Backend ----
    const WORKER_URL = "https://luba-ai-proxy.kobik8512.workers.dev";

    // ---- Kobi identity verification (unchanged logic) ----
    const KOBI_PASSWORD = "blue007";
    const KOBI_CLAIM_REGEX = /\b(i'?m|i am|this is|it'?s|my name is)\s+kobi\b|\bkobi\s+here\b|\b(i'?m|i am|this is|it'?s)\s+(your|the)\s+(creator|maker|developer|dev|programmer|coder|owner|founder|admin|master|boss)\b|\bi\s+(created|made|built|programmed|coded|developed|own)\s+you\b/i;
    let isVerifiedKobi = false;
    let awaitingKobiPassword = false;

    // ============================================================
    // Account / storage helpers
    // ============================================================
    const BAD_WORDS = [
        "fuck","shit","bitch","asshole","nigger","nigga","faggot","cunt","dick","pussy",
        "slut","whore","retard","nazi","hitler","kill","rape","porn","sex","nude"
    ];

    function getUsers() {
        try {
            return JSON.parse(localStorage.getItem('luba_users') || '{}');
        } catch {
            return {};
        }
    }

    function saveUsers(users) {
        localStorage.setItem('luba_users', JSON.stringify(users));
    }

    function getCurrentUsername() {
        return localStorage.getItem('luba_current_user') || null;
    }

    function setCurrentUsername(name) {
        if (name) localStorage.setItem('luba_current_user', name);
        else localStorage.removeItem('luba_current_user');
    }

    async function hashPassword(pw) {
        const enc = new TextEncoder().encode(pw);
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function isValidUsername(name, options = {}) {
        // options.excludeSelf = current username to ignore when checking availability (for settings rename)
        if (!name || typeof name !== 'string') return { ok: false, msg: 'Username is required.' };
        const trimmed = name.trim();
        if (trimmed.length < 3) return { ok: false, msg: 'Username must be at least 3 characters.' };
        if (trimmed.length > 20) return { ok: false, msg: 'Username cannot be longer than 20 characters.' };
        if (/\s/.test(trimmed)) return { ok: false, msg: 'Username cannot contain spaces.' };
        if (!/^[a-zA-Z0-9_]+$/.test(trimmed)) return { ok: false, msg: 'Only letters, numbers and underscore allowed.' };
        const lower = trimmed.toLowerCase();
        for (const bad of BAD_WORDS) {
            if (lower.includes(bad)) return { ok: false, msg: 'That username is not allowed.' };
        }
        // Taken check
        const users = getUsers();
        const existing = users[lower];
        if (existing) {
            const exclude = (options.excludeSelf || '').toLowerCase();
            if (existing.username.toLowerCase() !== exclude) {
                return { ok: false, msg: 'That username is already taken.' };
            }
        }
        return { ok: true, value: trimmed };
    }

    // Live status icons (SVG)
    const ICON_OK = '<svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const ICON_BAD = '<svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

    function updateUsernameStatus(inputEl, statusEl, options = {}) {
        const val = inputEl.value;
        statusEl.classList.remove('empty', 'checking', 'ok', 'bad');
        inputEl.classList.remove('username-ok', 'username-bad');

        if (!val) {
            statusEl.classList.add('empty');
            statusEl.innerHTML = '';
            return false;
        }

        const check = isValidUsername(val, options);
        if (check.ok) {
            statusEl.classList.add('ok');
            statusEl.innerHTML = ICON_OK + ' Username is available';
            inputEl.classList.add('username-ok');
            return true;
        } else {
            statusEl.classList.add('bad');
            statusEl.innerHTML = ICON_BAD + ' ' + check.msg;
            inputEl.classList.add('username-bad');
            return false;
        }
    }

    function isValidPassword(pw) {
        if (!pw || pw.length < 8) return { ok: false, msg: 'Password must be at least 8 characters.' };
        return { ok: true };
    }

    function getDefaultAvatar(gender) {
        // Simple colored initials-style SVG data URL
        const letter = (currentUser && currentUser.username) ? currentUser.username[0].toUpperCase() : (gender === 'girl' ? 'G' : 'B');
        const bg = gender === 'girl' ? '#9b51e0' : '#00d2ff';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="${bg}"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-size="28" font-family="Segoe UI,sans-serif" font-weight="bold">${letter}</text></svg>`;
        return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    function getUserAvatarUrl(user) {
        if (!user) return getDefaultAvatar('boy');
        if (user.profilePic) return user.profilePic;
        return getDefaultAvatar(user.gender || 'boy');
    }

    function loadUserChatHistory(username) {
        try {
            const raw = localStorage.getItem('luba_chat_' + username);
            return raw ? JSON.parse(raw) : [];
        } catch {
            return [];
        }
    }

    function saveUserChatHistory(username, history) {
        try {
            let trimmed = history;
            if (trimmed.length > 30) trimmed = trimmed.slice(-30);
            localStorage.setItem('luba_chat_' + username, JSON.stringify(trimmed));
        } catch (err) {
            // quota — try hard trim
            let trimmed = history.slice();
            while (trimmed.length > 4) {
                trimmed = trimmed.slice(4);
                try {
                    localStorage.setItem('luba_chat_' + username, JSON.stringify(trimmed));
                    return;
                } catch (_) {}
            }
            console.warn('Could not save chat history.');
        }
    }

    function loadUserPrefs(username) {
        try {
            return JSON.parse(localStorage.getItem('luba_prefs_' + username) || '{}');
        } catch {
            return {};
        }
    }

    function saveUserPrefs(username, prefs) {
        localStorage.setItem('luba_prefs_' + username, JSON.stringify(prefs));
    }

    // ============================================================
    // Auth UI
    // ============================================================
    let selectedGender = 'boy';

    tabLogin.onclick = () => {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        loginForm.classList.add('active');
        signupForm.classList.remove('active');
        loginError.textContent = '';
        signupError.textContent = '';
    };

    tabSignup.onclick = () => {
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        signupForm.classList.add('active');
        loginForm.classList.remove('active');
        loginError.textContent = '';
        signupError.textContent = '';
    };

    genderBoy.onclick = () => {
        selectedGender = 'boy';
        genderBoy.classList.add('selected');
        genderGirl.classList.remove('selected');
    };
    genderGirl.onclick = () => {
        selectedGender = 'girl';
        genderGirl.classList.add('selected');
        genderBoy.classList.remove('selected');
    };

    // Live username validation (signup) — Roblox-style feedback as you type
    const signupUsernameInput = document.getElementById('signup-username');
    const signupUsernameStatus = document.getElementById('signup-username-status');
    signupUsernameInput.addEventListener('input', () => {
        updateUsernameStatus(signupUsernameInput, signupUsernameStatus);
    });
    signupUsernameInput.addEventListener('blur', () => {
        updateUsernameStatus(signupUsernameInput, signupUsernameStatus);
    });

    // Live username validation (settings rename)
    const settingsUsernameStatus = document.getElementById('settings-username-status');
    settingsUsername.addEventListener('input', () => {
        if (settingsUsername.readOnly) return;
        updateUsernameStatus(settingsUsername, settingsUsernameStatus, {
            excludeSelf: currentUser ? currentUser.username : ''
        });
    });

    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        loginError.textContent = '';
        const uname = document.getElementById('login-username').value.trim();
        const pw = document.getElementById('login-password').value;
        if (!uname || !pw) {
            loginError.textContent = 'Enter username and password.';
            return;
        }
        const users = getUsers();
        const user = users[uname.toLowerCase()];
        if (!user) {
            loginError.textContent = 'No account with that username.';
            return;
        }
        const hash = await hashPassword(pw);
        if (hash !== user.passwordHash) {
            loginError.textContent = 'Wrong password.';
            return;
        }
        // success
        setCurrentUsername(user.username);
        enterApp(user);
    };

    signupForm.onsubmit = async (e) => {
        e.preventDefault();
        signupError.textContent = '';
        const unameRaw = document.getElementById('signup-username').value;
        const pw = document.getElementById('signup-password').value;
        const pw2 = document.getElementById('signup-password2').value;
        const dob = document.getElementById('signup-dob').value;

        const nameCheck = isValidUsername(unameRaw);
        if (!nameCheck.ok) {
            signupError.textContent = nameCheck.msg;
            return;
        }
        const pwCheck = isValidPassword(pw);
        if (!pwCheck.ok) {
            signupError.textContent = pwCheck.msg;
            return;
        }
        if (pw !== pw2) {
            signupError.textContent = 'Passwords do not match.';
            return;
        }
        if (!dob) {
            signupError.textContent = 'Please enter your date of birth.';
            return;
        }

        const users = getUsers();
        const key = nameCheck.value.toLowerCase();
        if (users[key]) {
            signupError.textContent = 'That username is already taken.';
            return;
        }

        const hash = await hashPassword(pw);
        const newUser = {
            username: nameCheck.value,
            passwordHash: hash,
            gender: selectedGender,
            dob: dob,
            profilePic: null,
            lastUsernameChange: 0,
            createdAt: Date.now()
        };
        users[key] = newUser;
        saveUsers(users);
        setCurrentUsername(newUser.username);
        enterApp(newUser);
    };

    function enterApp(user) {
        currentUser = user;
        document.body.classList.add('logged-in');

        // restore prefs
        const prefs = loadUserPrefs(user.username);
        isStudyModeOn = !!prefs.studyMode;
        studyModeBtn.classList.toggle('active', isStudyModeOn);
        if (prefs.theme === 'light') document.body.classList.add('light');
        else document.body.classList.remove('light');

        // Kobi verification is still device-level for now
        isVerifiedKobi = localStorage.getItem('luba_verified_kobi') === 'true';

        chatHistory = loadUserChatHistory(user.username);
        renderSavedMessages();
        if (chatHistory.length === 0) {
            initDefaultChat();
        }
    }

    function logout() {
        setCurrentUsername(null);
        currentUser = null;
        chatHistory = [];
        document.body.classList.remove('logged-in');
        chatContainer.innerHTML = '';
        modalOverlay.style.display = 'none';
        // clear forms a bit
        document.getElementById('login-password').value = '';
        document.getElementById('signup-password').value = '';
        document.getElementById('signup-password2').value = '';
    }

    // On load: auto-login if session exists
    (function initAuth() {

            const COPY_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';

                name: "calculator",
                description: "Evaluates a math expression EXACTLY using real arithmetic. Always use this for any calculation, especially multi-digit multiplication/division, percentages, or multi-step math — never compute it yourself.",
                parameters: {
                    type: "OBJECT",
                    properties: {
                        expression: {
                            type: "STRING",
                            description: "A JS-style math expression, e.g. '(374921*84219)+983412'. Only digits, + - * / % ( ) . and spaces."
                        }
                    },
                    required: ["expression"]
                }
            },
            {
                name: "generate_image",
                description: "Generates an image from a text description and shows it to the user. Use this whenever the user asks to draw, generate, create, make, or see a picture/image/photo/artwork of something.",
                parameters: {
                    type: "OBJECT",
                    properties: {
                        prompt: {
                            type: "STRING",
                            description: "A clear, detailed English description of the image to generate, e.g. 'a golden retriever puppy running on a beach at sunset, photorealistic'."
                        }
                    },
                    required: ["prompt"]
                }
            }
        ]
    }];

    function runCalculator(expression) {
        if (!/^[\d\s+\-*/%().]+$/.test(expression)) {
            return "Error: invalid characters in expression.";
        }
        try {
            const result = Function(`"use strict"; return (${expression})`)();
            return String(result);
        } catch (err) {
            return "Error: could not evaluate expression.";
        }
    }

    function buildImageUrl(prompt) {
        const seed = Math.floor(Math.random() * 1000000);
        return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
    }

    function buildGeneratedImageHTML(url) {
        const safeUrl = url.replace(/'/g, "%27").replace(/"/g, "&quot;");
        return `<div class="generated-image-wrap" data-url="${safeUrl}">
            <img src="${url}" alt="Generated image" onerror="handleGeneratedImageError(this)">
        </div>`;
    }

    window.handleGeneratedImageError = function (imgEl) {
        if (!imgEl.dataset.retried) {
            imgEl.dataset.retried = "1";
            const sep = imgEl.src.includes('?') ? '&' : '?';
            imgEl.src = imgEl.src.split('&retry=')[0] + sep + 'retry=' + Date.now();
            return;
        }
        const wrap = imgEl.closest('.generated-image-wrap');
        if (!wrap) return;
        const url = wrap.dataset.url || imgEl.src;
        wrap.innerHTML = `
            <div class="image-error-box">
                <div style="display:flex; align-items:center; gap:6px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
                    <span>This image couldn't load here.</span>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="retry-image-btn" onclick="retryGeneratedImage(this)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Retry</button>
                    <button class="retry-image-btn" onclick="window.open('${url}', '_blank')"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Open in browser</button>
                </div>
            </div>`;
    };

    window.retryGeneratedImage = function (btn) {
        const wrap = btn.closest('.generated-image-wrap');
        if (!wrap) return;
        const url = wrap.dataset.url;
        wrap.innerHTML = `<img src="${url}" alt="Generated image" onerror="handleGeneratedImageError(this)">`;
    };

    function splitDataUrl(dataUrl) {
        const match = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
        if (!match) return { mimeType: "image/jpeg", data: "" };
        return { mimeType: match[1], data: match[2] };
    }

    async function sendMessage() {
        if (!currentUser) return;
        const text = userInput.value.trim();
        if (!text && !selectedImageBase64) return;

        // Kobi password challenge
        if (awaitingKobiPassword) {
            userInput.value = '';
            awaitingKobiPassword = false;
            if (text === KOBI_PASSWORD) {
                isVerifiedKobi = true;
                localStorage.setItem('luba_verified_kobi', 'true');
                pushPlainExchange(text.replace(/./g, '•'), "Password verified. Welcome back, Kobi!");
            } else {
                isVerifiedKobi = false;
                localStorage.removeItem('luba_verified_kobi');
                pushPlainExchange(text.replace(/./g, '•'), "That's not the right password, so I can't confirm you're Kobi. I'll keep treating you as a regular user for now.");
            }
            return;
        }

        if (KOBI_CLAIM_REGEX.test(text)) {
            userInput.value = '';
            awaitingKobiPassword = true;
            pushPlainExchange(text, "Wait — if you're really Kobi, what's the password?");
            return;
        }

        if (!WORKER_URL || WORKER_URL.includes('YOUR-WORKER-NAME')) {
            alert("Luba isn't fully set up yet — the developer needs to finish the backend setup (WORKER_URL) before this app can talk to the AI.");
            return;
        }

        const time = getTime();
        const imageToSend = selectedImageBase64;
        let display = text || "(sent a photo)";
        if (imageToSend) {
            display = (text ? text + "\n\n" : "") + `<img src="${imageToSend}">`;
        }
        appendMessage('user', display, time, !!imageToSend);

        selectedImageBase64 = null;
        imagePreview.style.display = 'none';
        imageInputEl.value = '';

        userInput.value = '';
        sendBtn.disabled = true;
        studyModeBtn.disabled = true;
        showTyping();

        const systemPrompt = buildSystemPrompt();
        const recent = chatHistory.slice(-10);

        const contents = recent.map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
        }));

        const currentParts = [{ text: text || (imageToSend ? "What do you see in this image?" : "") }];
        if (imageToSend) {
            const { mimeType, data } = splitDataUrl(imageToSend);
            currentParts.push({ inlineData: { mimeType, data } });
        }
        contents.push({ role: "user", parts: currentParts });

        const usingVision = !!imageToSend;
        const modelChain = ["gemini-3.6-flash", "gemini-3.5-flash-lite", "gemini-2.0-flash"];
        let modelIndex = 0;
        let model = modelChain[modelIndex];

        try {
            let reply = null;
            let accumulatedText = "";
            let guard = 0;
            let continueCount = 0;
            const MAX_CONTINUES = 6;
            const generatedImageUrls = [];

            while (guard < 16) {
                guard++;

                const payload = {
                    contents,
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { temperature: 0.4, maxOutputTokens: 8192 }
                };
                if (!usingVision) {
                    payload.tools = geminiTools;
                }

                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ model, payload })
                });

                const data = await res.json();

                if (data.error) {
                    const msg = data.error.message || "";
                    const isModelIssue = /not found|not supported|invalid model|does not exist/i.test(msg);
                    const isQuotaIssue = /quota|RESOURCE_EXHAUSTED|rate limit/i.test(msg);

                    if ((isModelIssue || isQuotaIssue) && modelIndex < modelChain.length - 1) {
                        modelIndex++;
                        model = modelChain[modelIndex];
                        continue;
                    }
                    reply = "Error: " + msg;
                    break;
                }

                const candidate = data.candidates?.[0];
                const parts = candidate?.content?.parts;
                if (!parts) {
                    reply = "Unexpected response from Gemini.";
                    break;
                }

                const functionCallParts = parts.filter(p => p.functionCall);
                if (functionCallParts.length > 0) {
                    contents.push({ role: "model", parts });
                    const responseParts = [];
                    for (const part of functionCallParts) {
                        const { name, args } = part.functionCall;
                        let result;
                        if (name === "calculator") {
                            result = { result: runCalculator(args.expression || "") };
                        } else if (name === "generate_image") {
                            const url = buildImageUrl(args.prompt || text || "an image");
                            generatedImageUrls.push(url);
                            result = { result: "Image generated and will be shown to the user automatically." };
                        } else {
                            result = { result: "Error: unknown tool." };
                        }
                        responseParts.push({ functionResponse: { name, response: result } });
                    }
                    contents.push({ role: "user", parts: responseParts });
                    continue;
                }

                accumulatedText += parts.map(p => p.text || "").join("");

                const wasCutOff = candidate?.finishReason === "MAX_TOKENS";
                if (wasCutOff && continueCount < MAX_CONTINUES) {
                    continueCount++;
                    contents.push({ role: "model", parts });
                    contents.push({
                        role: "user",
                        parts: [{ text: "Continue your previous answer exactly where you left off. Do not repeat anything you already said, and do not add any preamble like \"continuing...\" — just pick back up mid-thought and keep going to the end." }]
                    });
                    continue;
                }

                reply = accumulatedText;
                break;
            }

            removeTyping();

            if (reply == null) reply = "Sorry, something went wrong.";
            reply = reply
                .replace(/\*\*(.+?)\*\*/g, '$1')
                .replace(/[`]/g, '')
                .replace(/^#{1,6}\s*/gm, '');

            const hasImages = generatedImageUrls.length > 0;
            const displayReply = hasImages
                ? reply + generatedImageUrls.map(u => `\n\n${buildGeneratedImageHTML(u)}`).join('')
                : reply;
            appendMessage('ai', displayReply, getTime(), hasImages);

            chatHistory.push({
                role: "user",
                content: text || "(sent a photo)",
                time,
                displayHtml: imageToSend ? display : null,
                isHtml: !!imageToSend
            });
            chatHistory.push({
                role: "assistant",
                content: reply,
                time: getTime(),
                displayHtml: hasImages ? displayReply : null,
                isHtml: hasImages
            });
            saveChat();
        } catch (err) {
            removeTyping();
            appendMessage('ai', "Network error: " + err.message, getTime());
        } finally {
            sendBtn.disabled = false;
            studyModeBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }
</script>
</body>
</html>
