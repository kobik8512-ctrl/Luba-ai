<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luba AI</title>
    <style>
        :root {
            --bg: #131314;
            --header: #1e1f20;
            --text: #e3e3e3;
            --bubble-ai: #1e1f20;
            --bubble-user: #282a2c;
            --border: #2d2f31;
            --input-bg: #1e1f20;
            --accent: #ff007f;
        }

        body.light {
            --bg: #f5f5f5;
            --header: #ffffff;
            --text: #1a1a1a;
            --bubble-ai: #ffffff;
            --bubble-user: #e8e8e8;
            --border: #ddd;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        header {
            padding: 12px 16px;
            background-color: var(--header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.45));
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(75deg, #ff007f, #9b51e0, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .icon-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            padding: 7px 11px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        body.light .icon-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .icon-btn:hover {
            background: #3c4043;
        }

        body.light .icon-btn:hover {
            background: #ddd;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            line-height: 1.55;
            position: relative;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .user .avatar {
            background-color: #444746;
            color: #fff;
        }

        .ai .avatar {
            background: linear-gradient(135deg, #ff007f, #9b51e0);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .message-body {
            max-width: 85%;
        }

        .content {
            background: var(--bubble-ai);
            padding: 11px 15px;
            border-radius: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }

        .user .content {
            background: var(--bubble-user);
        }

        .content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
            cursor: pointer;
        }

        /* --- Fullscreen image lightbox (view large / screenshot / close) --- */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 20px;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-overlay img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 301;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lightbox-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            text-align: center;
            padding: 0 20px;
        }

        /* --- Generated image wrapper --- */
        .generated-image-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 8px;
        }

        .generated-image-wrap img {
            margin-top: 0;
        }

        .image-error-box {
            background: rgba(255, 0, 127, 0.08);
            border: 1px dashed var(--border);
            border-radius: 10px;
            padding: 14px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .retry-image-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
        }

        body.light .retry-image-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .retry-image-btn:hover {
            background: #3c4043;
        }

        .timestamp {
            font-size: 11px;
            opacity: 0.55;
            margin-top: 4px;
            padding-left: 4px;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 8px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .ai .content:hover .copy-btn {
            opacity: 1;
        }

        #input-wrapper {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #image-preview {
            display: none;
            position: relative;
            margin-bottom: 4px;
            max-width: 180px;
        }

        #image-preview img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        #remove-image {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }

        #input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 15px;
            border-radius: 24px;
            outline: none;
            resize: none;
            height: 50px;
            font-size: 1rem;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .action-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        body.light .action-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .action-btn:hover {
            background: #3c4043;
        }

        .send-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0 18px;
            height: 46px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            min-width: 80px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #e00070;
        }

        .send-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 8px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--header);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 16px;
            width: 92%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings-row span {
            font-size: 14px;
            font-weight: bold;
        }

        .modal input, .modal textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .modal textarea {
            height: 90px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .save-btn {
            background: var(--accent);
            color: white;
        }

        .cancel-btn {
            background: #555;
            color: white;
        }

        /* --- Saved chats panel --- */
        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .saved-chats-close {
            position: static;
            background: rgba(255, 255, 255, 0.08);
            width: 34px;
            height: 34px;
            font-size: 20px;
        }

        .save-chat-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .save-chat-row input {
            flex: 1;
            margin-bottom: 0;
        }

        .save-chat-row .save-btn {
            white-space: nowrap;
            padding: 0 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        #saved-chats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .saved-chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bubble-user);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
        }

        .saved-chat-item:hover {
            border-color: var(--accent);
        }

        .saved-chat-name {
            font-size: 14px;
            font-weight: bold;
            word-break: break-word;
        }

        .saved-chat-meta {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .saved-chat-delete {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 4px;
        }

        .saved-chats-empty {
            font-size: 13px;
            opacity: 0.6;
            text-align: center;
            padding: 16px 0;
        }
    </style>
</head>
<body>

<header>
    <div class="brand-container">
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="lubaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff007f"/>
                    <stop offset="50%" stop-color="#9b51e0"/>
                    <stop offset="100%" stop-color="#00d2ff"/>
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <circle cx="50" cy="50" r="38" stroke="url(#lubaGrad)" stroke-width="3.5" fill="none" opacity="0.7"/>
            <path d="M32 28 L32 68 Q32 74 38 74 L62 74 Q68 74 68 68 L68 58 Q68 52 62 52 L48 52 L48 28 Q48 22 42 22 L38 22 Q32 22 32 28 Z" 
                  fill="url(#lubaGrad)" filter="url(#glow)"/>
            <circle cx="50" cy="50" r="7" fill="url(#lubaGrad)" filter="url(#glow)"/>
        </svg>
        <div class="logo">Luba AI</div>
    </div>
    <div class="header-actions">
        <button class="icon-btn" id="export-btn" title="Saved Chats"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg></button>
        <button class="icon-btn" id="clear-chat-btn" title="Clear chat"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
        <button class="icon-btn" id="open-settings-btn" title="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
</header>

<div id="chat-container"></div>

<div id="input-wrapper">
    <div id="image-preview">
        <img id="preview-img" src="" alt="Selected">
        <button id="remove-image">×</button>
    </div>
    <div id="input-container">
        <button class="action-btn" id="photo-btn" title="Photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="action-btn" id="mic-btn" title="Voice"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/></svg></button>
        <input type="file" id="image-input" accept="image/*" style="display:none">
        <textarea id="user-input" placeholder="Ask Luba AI something..."></textarea>
        <button class="send-btn" id="send-btn">Send</button>
    </div>
</div>

<div class="lightbox-overlay" id="lightbox-overlay">
    <button class="lightbox-close" id="lightbox-close" title="Close">×</button>
    <img id="lightbox-img" src="" alt="Full screen image">
    <div class="lightbox-hint">Tap and hold the image to save, or take a screenshot</div>
</div>

<div class="modal-overlay" id="saved-chats-overlay">
    <div class="modal">
        <div class="modal-header-row">
            <h3><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-right:4px;"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>Saved Chats</h3>
            <button class="lightbox-close saved-chats-close" id="close-saved-chats-btn" title="Close">×</button>
        </div>

        <div class="save-chat-row">
            <input type="text" id="save-chat-name-input" placeholder="Name this chat...">
            <button class="modal-btn save-btn" id="save-current-chat-btn">+ Save</button>
        </div>

        <div id="saved-chats-list"></div>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h3><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-right:4px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</h3>

        <div class="settings-row">
            <span>Appearance</span>
            <button class="icon-btn" id="theme-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg> Toggle Theme</button>
        </div>

        <p>Luba's personality (her name and creator are locked in and can't be changed here)</p>
        <textarea id="system-prompt-input" placeholder="Write how you want Luba to behave..."></textarea>

        <div class="modal-buttons">
            <button class="modal-btn cancel-btn" id="close-settings-btn">Cancel</button>
            <button class="modal-btn save-btn" id="save-settings-btn">Save</button>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const systemPromptInput = document.getElementById('system-prompt-input');
    const clearChatBtn = document.getElementById('clear-chat-btn');
    const photoBtn = document.getElementById('photo-btn');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');
    const removeImageBtn = document.getElementById('remove-image');
    const themeBtn = document.getElementById('theme-btn');
    const exportBtn = document.getElementById('export-btn');
    const micBtn = document.getElementById('mic-btn');

    // ---- Your backend proxy ----
    // After you deploy the Cloudflare Worker (worker.js), paste its URL here.
    // It looks like: https://luba-ai-proxy.YOUR-SUBDOMAIN.workers.dev
    const WORKER_URL = "https://luba-ai-proxy.kobik8512.workers.dev";

    let chatHistory = [];
    let selectedImageBase64 = null;
    let isListening = false;

    // ---- Fullscreen image lightbox ----
    const lightboxOverlay = document.getElementById('lightbox-overlay');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(src) {
        lightboxImg.src = src;
        lightboxOverlay.classList.add('active');
    }

    function closeLightbox() {
        lightboxOverlay.classList.remove('active');
        lightboxImg.src = '';
    }

    lightboxClose.onclick = closeLightbox;
    lightboxOverlay.onclick = (e) => {
        // Clicking the dark backdrop (not the image itself) also closes it.
        if (e.target === lightboxOverlay) closeLightbox();
    };
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    // ---- Calculator tool: does REAL math in JS, not "guessed" by the model ----
    // ---- Image tool: generates real images via a free, no-key API (Pollinations.ai) ----
    const geminiTools = [{
        functionDeclarations: [
            {
                name: "calculator",
                description: "Evaluates a math expression EXACTLY using real arithmetic. Always use this for any calculation, especially multi-digit multiplication/division, percentages, or multi-step math — never compute it yourself.",
                parameters: {
                    type: "OBJECT",
                    properties: {
                        expression: {
                            type: "STRING",
                            description: "A JS-style math expression, e.g. '(374921*84219)+983412'. Only digits, + - * / % ( ) . and spaces."
                        }
                    },
                    required: ["expression"]
                }
            },
            {
                name: "generate_image",
                description: "Generates an image from a text description and shows it to the user. Use this whenever the user asks to draw, generate, create, make, or see a picture/image/photo/artwork of something.",
                parameters: {
                    type: "OBJECT",
                    properties: {
                        prompt: {
                            type: "STRING",
                            description: "A clear, detailed English description of the image to generate, e.g. 'a golden retriever puppy running on a beach at sunset, photorealistic'."
                        }
                    },
                    required: ["prompt"]
                }
            }
        ]
    }];

    function runCalculator(expression) {
        if (!/^[\d\s+\-*/%().]+$/.test(expression)) {
            return "Error: invalid characters in expression.";
        }
        try {
            // eslint-disable-next-line no-new-func
            const result = Function(`"use strict"; return (${expression})`)();
            return String(result);
        } catch (err) {
            return "Error: could not evaluate expression.";
        }
    }

    function buildImageUrl(prompt) {
        const seed = Math.floor(Math.random() * 1000000);
        return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
    }

    // Builds the HTML for a generated image (tap it to view fullscreen).
    // If the image fails to load (some wrapped/embedded webviews block or
    // time out on the pollinations.ai request), it auto-retries once with a
    // cache-busting param, then falls back to a visible "Retry / Open in
    // browser" box instead of leaving a dead broken-image icon.
    function buildGeneratedImageHTML(url) {
        const safeUrl = url.replace(/'/g, "%27").replace(/"/g, "&quot;");
        return `<div class="generated-image-wrap" data-url="${safeUrl}">
            <img src="${url}" alt="Generated image" onerror="handleGeneratedImageError(this)">
        </div>`;
    }

    window.handleGeneratedImageError = function (imgEl) {
        if (!imgEl.dataset.retried) {
            // First failure: try again once with a fresh cache-busting param —
            // this alone fixes most transient/one-off load failures.
            imgEl.dataset.retried = "1";
            const sep = imgEl.src.includes('?') ? '&' : '?';
            imgEl.src = imgEl.src.split('&retry=')[0] + sep + 'retry=' + Date.now();
            return;
        }

        // Second failure: give the user a visible, actionable fallback instead
        // of a dead broken-image icon.
        const wrap = imgEl.closest('.generated-image-wrap');
        if (!wrap) return;
        const url = wrap.dataset.url || imgEl.src;
        wrap.innerHTML = `
            <div class="image-error-box">
                <div style="display:flex; align-items:center; gap:6px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
                    <span>This image couldn't load here.</span>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="retry-image-btn" onclick="retryGeneratedImage(this)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Retry</button>
                    <button class="retry-image-btn" onclick="window.open('${url}', '_blank')"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Open in browser</button>
                </div>
            </div>`;
    };

    window.retryGeneratedImage = function (btn) {
        const wrap = btn.closest('.generated-image-wrap');
        if (!wrap) return;
        const url = wrap.dataset.url;
        wrap.innerHTML = `<img src="${url}" alt="Generated image" onerror="handleGeneratedImageError(this)">`;
    };

    function splitDataUrl(dataUrl) {
        // "data:image/png;base64,AAAA..." -> { mimeType, data }
        const match = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
        if (!match) return { mimeType: "image/jpeg", data: "" };
        return { mimeType: match[1], data: match[2] };
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text && !selectedImageBase64) return;

        if (!WORKER_URL || WORKER_URL.includes('YOUR-WORKER-NAME')) {
            alert("Luba isn't fully set up yet — the developer needs to finish the backend setup (WORKER_URL) before this app can talk to the AI.");
            return;
        }

        const time = getTime();
        let display = text || "(sent a photo)";
        if (selectedImageBase64) {
            display = (text ? text + "\n\n" : "") + `<img src="${selectedImageBase64}">`;
        }
        appendMessage('user', display, time, !!selectedImageBase64);

        userInput.value = '';
        sendBtn.disabled = true;
        showTyping();

        const customPersonality = localStorage.getItem('luba_system_prompt') || defaultPersonality;
        const systemPrompt = CORE_IDENTITY + "\n\n" + USER_PROFILE + "\n\n" + customPersonality;
        const recent = chatHistory.slice(-10);

        // Gemini's "contents" format: role is "user" or "model", each turn is a list of "parts".
        const contents = recent.map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
        }));

        const currentParts = [{ text: text || (selectedImageBase64 ? "What do you see in this image?" : "") }];
        if (selectedImageBase64) {
            const { mimeType, data } = splitDataUrl(selectedImageBase64);
            currentParts.push({ inlineData: { mimeType, data } });
        }
        contents.push({ role: "user", parts: currentParts });

        // Free-tier Gemini models, tried in order in case one isn't enabled for this key yet.
        const usingVision = !!selectedImageBase64;
        const modelChain = ["gemini-3.6-flash", "gemini-3.5-flash-lite", "gemini-2.0-flash"];
        let modelIndex = 0;
        let model = modelChain[modelIndex];

        try {
            let reply = null;
            let guard = 0;
            const generatedImageUrls = [];

            while (guard < 6) {
                guard++;

                const payload = {
                    contents,
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { temperature: 0.4, maxOutputTokens: 1024 }
                };
                if (!usingVision) {
                    payload.tools = geminiTools;
                }

                // Instead of calling Google directly with a key, the app calls
                // YOUR worker, which holds the key server-side and forwards
                // the request on. The user never sees or needs a key.
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ model, payload })
                });

                const data = await res.json();

                if (data.error) {
                    const msg = data.error.message || "";
                    const isModelIssue = /not found|not supported|invalid model|does not exist/i.test(msg);
                    const isQuotaIssue = /quota|RESOURCE_EXHAUSTED|rate limit/i.test(msg);

                    if ((isModelIssue || isQuotaIssue) && modelIndex < modelChain.length - 1) {
                        modelIndex++;
                        model = modelChain[modelIndex];
                        continue; // this model is unavailable or out of quota — try the next one in the chain
                    }

                    reply = "Error: " + msg;
                    break;
                }

                const candidate = data.candidates?.[0];
                const parts = candidate?.content?.parts;
                if (!parts) {
                    reply = "Unexpected response from Gemini.";
                    break;
                }

                const functionCallParts = parts.filter(p => p.functionCall);
                if (functionCallParts.length > 0) {
                    // Model wants to use one or more tools — run them for real, then loop back.
                    contents.push({ role: "model", parts });
                    const responseParts = [];
                    for (const part of functionCallParts) {
                        const { name, args } = part.functionCall;
                        let result;
                        if (name === "calculator") {
                            result = { result: runCalculator(args.expression || "") };
                        } else if (name === "generate_image") {
                            const url = buildImageUrl(args.prompt || text || "an image");
                            generatedImageUrls.push(url);
                            result = { result: "Image generated and will be shown to the user automatically." };
                        } else {
                            result = { result: "Error: unknown tool." };
                        }
                        responseParts.push({ functionResponse: { name, response: result } });
                    }
                    contents.push({ role: "user", parts: responseParts });
                    continue; // ask the model again with real results in hand
                }

                reply = parts.map(p => p.text || "").join("");
                break;
            }

            removeTyping();

            if (reply == null) {
                reply = "Sorry, something went wrong.";
            }
            reply = reply.replace(/[\*\_`#]/g, '');

            const hasImages = generatedImageUrls.length > 0;
            const displayReply = hasImages
                ? reply + generatedImageUrls.map(u => `\n\n${buildGeneratedImageHTML(u)}`).join('')
                : reply;
            appendMessage('ai', displayReply, getTime(), hasImages);

            chatHistory.push({ role: "user", content: text || "(sent a photo)", time });
            chatHistory.push({ role: "assistant", content: reply, time: getTime(), isHtml: hasImages });
            saveChat();
        } catch (err) {
            removeTyping();
            appendMessage('ai', "Network error: " + err.message, getTime());
        } finally {
            selectedImageBase64 = null;
            imagePreview.style.display = 'none';
            imageInput.value = '';
            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }
</script>
</body>
</html>
