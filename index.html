<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luba AI</title>
    <style>
        :root {
            --bg: #131314;
            --header: #1e1f20;
            --text: #e3e3e3;
            --bubble-ai: #1e1f20;
            --bubble-user: #282a2c;
            --border: #2d2f31;
            --input-bg: #1e1f20;
            --accent: #ff007f;
        }

        body.light {
            --bg: #f5f5f5;
            --header: #ffffff;
            --text: #1a1a1a;
            --bubble-ai: #ffffff;
            --bubble-user: #e8e8e8;
            --border: #ddd;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        header {
            padding: 12px 16px;
            background-color: var(--header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.45));
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(75deg, #ff007f, #9b51e0, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .icon-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            padding: 7px 11px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        body.light .icon-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .icon-btn:hover {
            background: #3c4043;
        }

        body.light .icon-btn:hover {
            background: #ddd;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            line-height: 1.55;
            position: relative;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .user .avatar {
            background-color: #444746;
            color: #fff;
        }

        .ai .avatar {
            background: linear-gradient(135deg, #ff007f, #9b51e0);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .message-body {
            max-width: 85%;
        }

        .content {
            background: var(--bubble-ai);
            padding: 11px 15px;
            border-radius: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }

        .user .content {
            background: var(--bubble-user);
        }

        .content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .timestamp {
            font-size: 11px;
            opacity: 0.55;
            margin-top: 4px;
            padding-left: 4px;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 8px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .ai .content:hover .copy-btn {
            opacity: 1;
        }

        #input-wrapper {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #image-preview {
            display: none;
            position: relative;
            margin-bottom: 4px;
            max-width: 180px;
        }

        #image-preview img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        #remove-image {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }

        #input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 15px;
            border-radius: 24px;
            outline: none;
            resize: none;
            height: 50px;
            font-size: 1rem;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .action-btn {
            background: #282a2c;
            border: 1px solid #444746;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        body.light .action-btn {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }

        .action-btn:hover {
            background: #3c4043;
        }

        .send-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0 18px;
            height: 46px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            min-width: 80px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #e00070;
        }

        .send-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 8px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--header);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 16px;
            width: 92%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .modal input, .modal textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .modal textarea {
            height: 90px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .save-btn {
            background: var(--accent);
            color: white;
        }

        .cancel-btn {
            background: #555;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <div class="brand-container">
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="lubaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff007f"/>
                    <stop offset="50%" stop-color="#9b51e0"/>
                    <stop offset="100%" stop-color="#00d2ff"/>
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <circle cx="50" cy="50" r="38" stroke="url(#lubaGrad)" stroke-width="3.5" fill="none" opacity="0.7"/>
            <path d="M32 28 L32 68 Q32 74 38 74 L62 74 Q68 74 68 68 L68 58 Q68 52 62 52 L48 52 L48 28 Q48 22 42 22 L38 22 Q32 22 32 28 Z" 
                  fill="url(#lubaGrad)" filter="url(#glow)"/>
            <circle cx="50" cy="50" r="7" fill="url(#lubaGrad)" filter="url(#glow)"/>
        </svg>
        <div class="logo">Luba AI</div>
    </div>
    <div class="header-actions">
        <button class="icon-btn" id="theme-btn">🌓</button>
        <button class="icon-btn" id="export-btn">💾</button>
        <button class="icon-btn" id="clear-chat-btn">🗑️</button>
        <button class="icon-btn" id="open-settings-btn">⚙️</button>
    </div>
</header>

<div id="chat-container"></div>

<div id="input-wrapper">
    <div id="image-preview">
        <img id="preview-img" src="" alt="Selected">
        <button id="remove-image">×</button>
    </div>
    <div id="input-container">
        <button class="action-btn" id="photo-btn" title="Photo">📷</button>
        <button class="action-btn" id="mic-btn" title="Voice">🎤</button>
        <input type="file" id="image-input" accept="image/*" style="display:none">
        <textarea id="user-input" placeholder="Ask Luba AI something..."></textarea>
        <button class="send-btn" id="send-btn">Send</button>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h3>⚙️ Settings</h3>
        <p>Your Groq API key (stored only in your browser)</p>
        <input type="password" id="api-key-input" placeholder="gsk_...">

        <p>Custom System Prompt (Luba’s personality)</p>
        <textarea id="system-prompt-input" placeholder="Write how you want Luba to behave..."></textarea>

        <div class="modal-buttons">
            <button class="modal-btn cancel-btn" id="close-settings-btn">Cancel</button>
            <button class="modal-btn save-btn" id="save-settings-btn">Save</button>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const apiKeyInput = document.getElementById('api-key-input');
    const systemPromptInput = document.getElementById('system-prompt-input');
    const clearChatBtn = document.getElementById('clear-chat-btn');
    const photoBtn = document.getElementById('photo-btn');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');
    const removeImageBtn = document.getElementById('remove-image');
    const themeBtn = document.getElementById('theme-btn');
    const exportBtn = document.getElementById('export-btn');
    const micBtn = document.getElementById('mic-btn');

    let chatHistory = [];
    let selectedImageBase64 = null;
    let isListening = false;

    const defaultSystemPrompt = `Your name is Luba AI. You were created by Kobi. You are a friendly, helpful, and slightly playful AI assistant. Use emojis sometimes to make the conversation fun. Keep answers clear and natural. Never say you were created by Meta, OpenAI or Groq — always say your creator is Kobi. When analyzing images, be careful and honest. If something looks AI-generated, say so.`;

    const aiAvatarHTML = `
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.7"/>
            <path d="M32 28 L32 68 Q32 74 38 74 L62 74 Q68 74 68 68 L68 58 Q68 52 62 52 L48 52 L48 28 Q48 22 42 22 L38 22 Q32 22 32 28 Z" fill="#ffffff"/>
            <circle cx="50" cy="50" r="7" fill="#ffffff"/>
        </svg>
    `;

    apiKeyInput.value = localStorage.getItem('luba_groq_key') || '';
    systemPromptInput.value = localStorage.getItem('luba_system_prompt') || defaultSystemPrompt;
    if (localStorage.getItem('luba_theme') === 'light') document.body.classList.add('light');

    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('luba_chat_history');
        if (saved) {
            try {
                chatHistory = JSON.parse(saved);
                renderSavedMessages();
            } catch {
                initDefaultChat();
            }
        } else {
            initDefaultChat();
        }
    });

    function initDefaultChat() {
        appendMessage('ai', "Hey! I'm Luba AI 😎 How can I help you today?");
    }

    function renderSavedMessages() {
        chatContainer.innerHTML = '';
        if (chatHistory.length === 0) {
            initDefaultChat();
            return;
        }
        chatHistory.forEach(msg => {
            appendMessage(msg.role === 'user' ? 'user' : 'ai', msg.content, msg.time);
        });
    }

    function saveChat() {
        if (chatHistory.length > 30) {
            chatHistory = chatHistory.slice(-30);
        }
        localStorage.setItem('luba_chat_history', JSON.stringify(chatHistory));
    }

    function getTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(sender, text, time = null, isHtml = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = sender === 'user' ? 'U' : aiAvatarHTML;

        const body = document.createElement('div');
        body.className = 'message-body';

        const content = document.createElement('div');
        content.className = 'content';

        if (isHtml) {
            content.innerHTML = text;
        } else {
            content.innerText = text;
        }

        if (sender === 'ai') {
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerText = '📋';
            copyBtn.title = 'Copy';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(content.innerText);
                copyBtn.innerText = '✅';
                setTimeout(() => copyBtn.innerText = '📋', 1500);
            };
            content.appendChild(copyBtn);
        }

        body.appendChild(content);

        const timeEl = document.createElement('div');
        timeEl.className = 'timestamp';
        timeEl.innerText = time || getTime();
        body.appendChild(timeEl);

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(body);
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return msgDiv;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message ai';
        div.id = 'typing-indicator';
        div.innerHTML = `
            <div class="avatar">${aiAvatarHTML}</div>
            <div class="message-body">
                <div class="content">
                    <div class="typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>`;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
    }

    themeBtn.onclick = () => {
        document.body.classList.toggle('light');
        localStorage.setItem('luba_theme', document.body.classList.contains('light') ? 'light' : 'dark');
    };

    exportBtn.onclick = () => {
        if (chatHistory.length === 0) {
            alert("No messages to save yet.");
            return;
        }

        let text = "Luba AI Chat Export\n\n";
        chatHistory.forEach(m => {
            text += `\( {m.role === 'user' ? 'You' : 'Luba'} ( \){m.time || ''}):\n${m.content}\n\n`;
        });

        try {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `luba-chat-${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert("✅ Chat saved! Check your Downloads folder.");
        } catch (err) {
            alert("❌ Save failed on this browser.\nTry using Chrome.");
        }
    };

    photoBtn.onclick = () => imageInput.click();
    imageInput.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 12 * 1024 * 1024) {
            alert("Image too big (max 12MB)");
            return;
        }
        const reader = new FileReader();
        reader.onload = ev => {
            selectedImageBase64 = ev.target.result;
            previewImg.src = selectedImageBase64;
            imagePreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    };
    removeImageBtn.onclick = () => {
        selectedImageBase64 = null;
        imagePreview.style.display = 'none';
        imageInput.value = '';
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        micBtn.onclick = () => {
            alert("❌ Voice input is not supported on this browser/device.\n\nIt works best on Chrome (Android).\nIt usually does NOT work on iPhone Safari or in-app browsers.");
        };
        micBtn.style.opacity = "0.5";
    } else {
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        micBtn.onclick = () => {
            if (isListening) {
                recognition.stop();
                return;
            }

            isListening = true;
            micBtn.style.background = '#ff007f';

            try {
                recognition.start();
            } catch (err) {
                isListening = false;
                micBtn.style.background = '';
                alert("❌ Could not start microphone.\nPlease allow microphone permission.");
            }
        };

        recognition.onresult = e => {
            userInput.value = e.results[0][0].transcript;
            isListening = false;
            micBtn.style.background = '';
        };

        recognition.onerror = (event) => {
            isListening = false;
            micBtn.style.background = '';

            if (event.error === 'not-allowed') {
                alert("❌ Microphone permission denied.");
            } else {
                alert("❌ Voice input failed on this device.");
            }
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.style.background = '';
        };
    }

    openSettingsBtn.onclick = () => {
        apiKeyInput.value = localStorage.getItem('luba_groq_key') || '';
        systemPromptInput.value = localStorage.getItem('luba_system_prompt') || defaultSystemPrompt;
        modalOverlay.style.display = 'flex';
    };
    closeSettingsBtn.onclick = () => modalOverlay.style.display = 'none';
    saveSettingsBtn.onclick = () => {
        localStorage.setItem('luba_groq_key', apiKeyInput.value.trim());
        localStorage.setItem('luba_system_prompt', systemPromptInput.value.trim() || defaultSystemPrompt);
        modalOverlay.style.display = 'none';
        alert('Settings saved!');
    };

    clearChatBtn.onclick = () => {
        if (confirm("Clear all messages?")) {
            chatHistory = [];
            localStorage.removeItem('luba_chat_history');
            chatContainer.innerHTML = '';
            initDefaultChat();
        }
    };

    userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!sendBtn.disabled) sendMessage();
        }
    });

    sendBtn.onclick = sendMessage;

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = localStorage.getItem('luba_groq_key') || '';
        if (!text && !selectedImageBase64) return;
        if (!apiKey) {
            alert("Please set your Groq API key in Settings first!");
            return;
        }

        const time = getTime();
        let display = text || "(sent a photo)";
        if (selectedImageBase64) {
            display = (text ? text + "\n\n" : "") + `<img src="${selectedImageBase64}">`;
        }
        appendMessage('user', display, time, !!selectedImageBase64);

        userInput.value = '';
        sendBtn.disabled = true;
        showTyping();

        const systemPrompt = localStorage.getItem('luba_system_prompt') || defaultSystemPrompt;
        const recent = chatHistory.slice(-10);

        const messages = [{ role: "system", content: systemPrompt }];
        recent.forEach(m => {
            messages.push({
                role: m.role === 'assistant' ? 'assistant' : 'user',
                content: m.content
            });
        });

        let userContent;
        if (selectedImageBase64) {
            userContent = [
                { type: "text", text: text || "What do you see in this image?" },
                { type: "image_url", image_url: { url: selectedImageBase64 } }
            ];
        } else {
            userContent = text;
        }
        messages.push({ role: "user", content: userContent });

        const model = selectedImageBase64 ? "qwen/qwen3.8-27b" : "openai/gpt-oss-120b";

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model,
                    messages,
                    temperature: 0.7,
                    max_tokens: 1024
                })
            });

            const data = await res.json();
            removeTyping();

            if (data.error) {
                appendMessage('ai', "Error: " + data.error.message, getTime());
            } else if (data.choices?.[0]) {
                let reply = data.choices[0].message.content.replace(/[\*\_`#]/g, '');
                appendMessage('ai', reply, getTime());

                chatHistory.push({ role: "user", content: text || "(sent a photo)", time });
                chatHistory.push({ role: "assistant", content: reply, time: getTime() });
                saveChat();
            } else {
                appendMessage('ai', "Unexpected response from Groq.", getTime());
            }
        } catch (err) {
            removeTyping();
            appendMessage('ai', "Network error: " + err.message, getTime());
        } finally {
            selectedImageBase64 = null;
            imagePreview.style.display = 'none';
            imageInput.value = '';
            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }
</script>
</body>
</html>
