<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Zoom Chat</title>
<style>
:root {
  --bg: #0c0c0d;
  --panel: #141415;
  --card: #1c1c1e;
  --text: #f2f2f2;
  --muted: #8e8e93;
  --border: #2c2c2e;
  --blue: #0a84ff;
  --danger: #ff453a;
  --bubble-me: #2c2c2e;
  --bubble-them: #1c1c1e;
  --fire: #ff9f0a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
img { max-width: 100%; }

#auth {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start;
  justify-content: center; padding: 28px 16px; overflow-y: auto; background: var(--bg);
}
#auth.hidden { display: none; }
.auth-card {
  width: 100%; max-width: 380px; margin-top: 6vh; background: var(--panel);
  border: 1px solid var(--border); border-radius: 16px; padding: 28px 20px 22px;
}
.auth-logo {
  width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 14px;
  background: #1a1a1c; display: grid; place-items: center; border: 1px solid var(--border);
}
.auth-card h1 { text-align: center; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.auth-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 20px; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--bg); padding: 4px; border-radius: 10px; }
.tabs button { flex: 1; padding: 9px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 13px; }
.tabs button.active { background: var(--card); color: var(--text); }
label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
input[type=text], input[type=password], input[type=number], textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); outline: none;
}
input:focus, textarea:focus { border-color: #48484a; }
.auth-err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }
.btn-primary {
  width: 100%; margin-top: 16px; padding: 13px; border-radius: 12px;
  background: #fff; color: #000; font-weight: 700; font-size: 14px;
}
.btn-primary:disabled { opacity: 0.45; }

#app { display: none; height: 100dvh; flex-direction: column; }
#app.show { display: flex; }
header.app-bar {
  flex-shrink: 0; height: 52px; display: flex; align-items: center;
  gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border);
}
header .title {
  font-weight: 700; font-size: 16px; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em;
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--text); flex-shrink: 0; font-size: 16px;
}
.icon-btn:active { background: var(--card); }

.nav-tabs {
  display: flex; padding: 0 8px; background: var(--panel);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.nav-tabs button {
  flex: 1; padding: 12px 8px; font-weight: 600; font-size: 13px;
  color: var(--muted); border-bottom: 2px solid transparent;
}
.nav-tabs button.active { color: var(--text); border-bottom-color: #fff; }

.view { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }
.list { flex: 1; overflow-y: auto; padding: 8px 10px 20px; -webkit-overflow-scrolling: touch; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 12px; margin-bottom: 2px;
}
.row:active { background: var(--card); }
.avatar {
  width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: #2a2a2c; flex-shrink: 0;
}
.avatar.sm { width: 34px; height: 34px; }
.row-info { flex: 1; min-width: 0; }
.row-info .name {
  font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 4px;
}
.row-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.streak-pill { font-size: 12px; font-weight: 700; color: var(--fire); flex-shrink: 0; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; line-height: 1.5; }
.section-label {
  font-size: 11px; color: var(--muted); font-weight: 700; margin: 14px 6px 6px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.fab-row {
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px;
  flex-shrink: 0; border-top: 1px solid var(--border); background: var(--panel);
}
.fab {
  flex: 1; padding: 12px; border-radius: 12px; background: #fff; color: #000;
  font-weight: 700; font-size: 13px;
}
.fab.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }

.verified-badge { display: inline-flex; width: 15px; height: 15px; flex-shrink: 0; }
.verified-badge svg { width: 100%; height: 100%; display: block; }

#chat-view {
  position: fixed; inset: 0; z-index: 40; background: var(--bg);
  display: none; flex-direction: column;
}
#chat-view.open { display: flex; }
#chat-messages {
  flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column;
  gap: 6px; -webkit-overflow-scrolling: touch;
}
.msg {
  max-width: 80%; padding: 9px 12px; border-radius: 16px; font-size: 14.5px;
  line-height: 1.4; word-break: break-word; border: 1px solid var(--border);
}
.msg.me { align-self: flex-end; background: var(--bubble-me); border-bottom-right-radius: 5px; }
.msg.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 5px; }
.msg .who { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 3px; display: flex; align-items: center; gap: 4px; }
.msg .time { font-size: 10px; color: var(--muted); margin-top: 5px; text-align: right; }
.msg img.attach { display: block; border-radius: 10px; margin-top: 6px; max-height: 220px; cursor: pointer; }
.composer {
  flex-shrink: 0; display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: var(--panel); border-top: 1px solid var(--border);
}
.composer textarea {
  flex: 1; min-height: 40px; max-height: 110px; resize: none; border-radius: 12px;
  padding: 10px 12px; border: 1px solid var(--border); background: var(--bg);
}
.composer .send {
  width: 40px; height: 40px; border-radius: 12px; background: #fff; color: #000;
  display: grid; place-items: center; flex-shrink: 0; font-weight: 700;
}
.preview-bar {
  display: none; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border);
  align-items: center; gap: 10px;
}
.preview-bar.show { display: flex; }
.preview-bar img { height: 52px; border-radius: 8px; }
.preview-bar button { color: var(--danger); font-weight: 600; font-size: 12px; }
.chat-streak { font-size: 12px; font-weight: 700; color: var(--fire); white-space: nowrap; }

.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.72);
  display: none; align-items: flex-end; justify-content: center; padding: 10px;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
  background: var(--panel); border-radius: 16px; padding: 18px 16px;
  border: 1px solid var(--border);
}
.sheet h3 { font-size: 17px; margin-bottom: 12px; font-weight: 700; }
.sheet .actions { display: flex; gap: 8px; margin-top: 16px; }
.sheet .actions button {
  flex: 1; padding: 12px; border-radius: 11px; font-weight: 700; font-size: 13px;
  background: var(--card); border: 1px solid var(--border);
}
.sheet .actions button.main { background: #fff; color: #000; border: none; }
.sheet .actions button.danger { color: var(--danger); border-color: #3a2020; }
.small-btn {
  padding: 7px 11px; border-radius: 8px; background: var(--card);
  font-size: 12px; font-weight: 600; border: 1px solid var(--border);
}
.small-btn.accent { background: #fff; color: #000; border: none; }
.small-btn.danger { color: var(--danger); }
.profile-edit .avatar-big {
  width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
  display: block; margin: 0 auto 12px; background: #2a2a2c; border: 1px solid var(--border);
}
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
  background: #1c1c1e; color: #fff; padding: 11px 16px; border-radius: 10px;
  font-size: 13px; z-index: 100; opacity: 0; transition: .22s; pointer-events: none;
  border: 1px solid var(--border); max-width: 90%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.lightbox {
  position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.94);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 10px; }
.owner-ball {
  position: fixed; right: 14px; bottom: 88px; z-index: 35;
  width: 44px; height: 44px; border-radius: 50%; background: var(--card);
  border: 1px solid var(--border); display: none; place-items: center; font-size: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.owner-ball.show { display: grid; }
.owner-user-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.owner-chat-line {
  padding: 8px 10px; margin-bottom: 6px; border-radius: 10px;
  background: var(--card); font-size: 13px; border: 1px solid var(--border);
}
.owner-chat-line .meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <h1>Zoom Chat</h1>
    <p class="sub">Groups · friends · photos</p>
    <div class="tabs">
      <button type="button" class="active" id="tab-login">Log in</button>
      <button type="button" id="tab-signup">Sign up</button>
    </div>
    <form id="login-form">
      <label>Username</label>
      <input type="text" id="login-user" autocomplete="username" required maxlength="20" />
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password" required />
      <div class="auth-err" id="login-err"></div>
      <button class="btn-primary" type="submit">Log in</button>
    </form>
    <form id="signup-form" style="display:none">
      <label>Username</label>
      <input type="text" id="su-user" autocomplete="username" required maxlength="20" placeholder="3–20 characters" />
      <label>Display name</label>
      <input type="text" id="su-display" maxlength="40" placeholder="How friends see you" />
      <label>Password</label>
      <input type="password" id="su-pass" autocomplete="new-password" required minlength="8" />
      <label>Confirm password</label>
      <input type="password" id="su-pass2" autocomplete="new-password" required />
      <div class="auth-err" id="su-err"></div>
      <button class="btn-primary" type="submit">Create account</button>
    </form>
  </div>
</div>

<div id="app">
  <header class="app-bar">
    <div class="title">Zoom Chat</div>
    <button class="icon-btn" id="btn-profile" title="Profile" aria-label="Profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </header>
  <div class="nav-tabs">
    <button type="button" class="active" data-tab="groups">Groups</button>
    <button type="button" data-tab="friends">Friends</button>
  </div>
  <div class="view active" id="view-groups">
    <div class="list" id="groups-list"></div>
    <div class="fab-row"><button class="fab" id="btn-create-group">Create group</button></div>
  </div>
  <div class="view" id="view-friends">
    <div class="list" id="friends-list"></div>
    <div class="fab-row"><button class="fab secondary" id="btn-add-friend">Add friend</button></div>
  </div>
</div>

<div id="chat-view">
  <header class="app-bar">
    <button class="icon-btn" id="chat-back">←</button>
    <img class="avatar sm" id="chat-avatar" alt="" />
    <div class="title" id="chat-title">Chat</div>
    <span class="chat-streak" id="chat-streak" style="display:none"></span>
    <button class="icon-btn" id="chat-info" title="Info">ⓘ</button>
  </header>
  <div id="chat-messages"></div>
  <div class="preview-bar" id="img-preview-bar">
    <img id="img-preview" alt="preview" />
    <span style="flex:1;font-size:12px;color:var(--muted)">Photo ready</span>
    <button type="button" id="img-preview-clear">Remove</button>
  </div>
  <div class="composer">
    <button class="icon-btn" id="btn-pick-photo" title="Photo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </button>
    <input type="file" id="photo-input" accept="image/*" hidden />
    <textarea id="composer-input" rows="1" placeholder="Message…"></textarea>
    <button class="send" id="btn-send" title="Send">↑</button>
  </div>
</div>

<button type="button" class="owner-ball" id="owner-ball" title="Owner">⚙</button>

<div class="overlay" id="modal-create-group">
  <div class="sheet">
    <h3>Create group</h3>
    <label>Group name</label>
    <input type="text" id="cg-name" maxlength="60" placeholder="e.g. Weekend crew" />
    <label>Invite friends (usernames, comma separated)</label>
    <input type="text" id="cg-invite" placeholder="alice, bob" />
    <div class="actions">
      <button type="button" data-close="modal-create-group">Cancel</button>
      <button type="button" class="main" id="cg-submit">Create</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-add-friend">
  <div class="sheet">
    <h3>Add friend</h3>
    <label>Username</label>
    <input type="text" id="af-user" maxlength="20" placeholder="username" />
    <div class="auth-err" id="af-err"></div>
    <div class="actions">
      <button type="button" data-close="modal-add-friend">Cancel</button>
      <button type="button" class="main" id="af-submit">Send request</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-profile">
  <div class="sheet profile-edit">
    <h3>Profile</h3>
    <img class="avatar-big" id="pf-avatar" alt="" />
    <div style="text-align:center;margin-bottom:12px">
      <button type="button" class="small-btn" id="pf-change-photo">Change photo</button>
      <input type="file" id="pf-photo-input" accept="image/*" hidden />
    </div>
    <label>Display name</label>
    <input type="text" id="pf-display" maxlength="40" />
    <label>Username</label>
    <input type="text" id="pf-username" maxlength="20" />
    <label>Bio</label>
    <textarea id="pf-bio" rows="3" maxlength="160" placeholder="Say something…"></textarea>
    <div class="auth-err" id="pf-err"></div>
    <div class="actions">
      <button type="button" data-close="modal-profile">Close</button>
      <button type="button" class="main" id="pf-save">Save</button>
    </div>
    <button type="button" class="btn-primary" style="background:transparent;color:var(--danger);border:1px solid var(--border);margin-top:12px" id="btn-logout">Log out</button>
  </div>
</div>

<div class="overlay" id="modal-group-info">
  <div class="sheet">
    <h3 id="gi-title">Group</h3>
    <div id="gi-streak" class="hint"></div>
    <div id="gi-members"></div>
    <label style="margin-top:12px">Invite by username</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="gi-invite" placeholder="username" style="flex:1" />
      <button type="button" class="small-btn accent" id="gi-invite-btn">Add</button>
    </div>
    <div class="actions">
      <button type="button" data-close="modal-group-info">Close</button>
      <button type="button" class="danger" id="gi-leave">Leave group</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-owner-pass">
  <div class="sheet">
    <h3>Owner CMDs</h3>
    <p class="hint">Enter owner password to continue.</p>
    <label>Password</label>
    <input type="password" id="owner-pass-input" autocomplete="off" />
    <div class="auth-err" id="owner-pass-err"></div>
    <div class="actions">
      <button type="button" data-close="modal-owner-pass">Cancel</button>
      <button type="button" class="main" id="owner-pass-go">Enter</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-owner">
  <div class="sheet" style="max-height:92vh">
    <h3>Owner CMDs</h3>
    <p class="hint">Verify users · view groups &amp; chats · set streaks. Verified is cosmetic only.</p>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
      <button type="button" class="small-btn accent" id="owner-tab-users">Users</button>
      <button type="button" class="small-btn" id="owner-tab-groups">Groups</button>
    </div>
    <input type="text" id="owner-search" placeholder="Search…" style="margin-bottom:10px" />
    <div id="owner-list" style="max-height:50vh;overflow-y:auto"></div>
    <div class="actions"><button type="button" data-close="modal-owner">Close</button></div>
  </div>
</div>

<div class="overlay" id="modal-owner-chat">
  <div class="sheet" style="max-height:92vh">
    <h3 id="oc-title">Chat</h3>
    <div id="oc-streak-row" style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <label style="margin:0">Streak</label>
      <input type="number" id="oc-streak-val" min="0" max="99999" style="width:90px" />
      <button type="button" class="small-btn accent" id="oc-streak-save">Set</button>
    </div>
    <div id="oc-messages" style="max-height:55vh;overflow-y:auto"></div>
    <div class="actions"><button type="button" data-close="modal-owner-chat">Back</button></div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="" /></div>
<div id="toast"></div>

<script>
(() => {
  const API = 'https://zoom-chat.kobik8512.workers.dev';
  const OWNER_PASSWORD = 'kobiTheowner';
  const VERIFIED_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#0A84FF"/><path d="M7 12.2l3.2 3.2L17 8.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const $ = (id) => document.getElementById(id);
  const state = {
    token: localStorage.getItem('zc_token') || null,
    profile: null, myUserId: null,
    friends: [], incoming: [], outgoing: [], groups: [],
    chatId: null, chatKind: null, chatMeta: null, messages: [],
    pollTimer: null, pendingImage: null,
    ownerUnlocked: false, ownerTab: 'users',
    ownerUsers: [], ownerGroups: [], ownerChatId: null,
  };

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function badge(v) {
    return v ? '<span class="verified-badge" title="Verified">' + VERIFIED_SVG + '</span>' : '';
  }
  function defaultAvatar(name) {
    const letter = String(name || '?').slice(0, 1).toUpperCase();
    return 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect fill="#2a2a2c" width="96" height="96" rx="48"/><text x="48" y="58" text-anchor="middle" fill="#8e8e93" font-size="36" font-family="sans-serif">' + letter + '</text></svg>'
    );
  }
  function timeStr(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function api(action, body = {}) {
    const payload = { action, ...body };
    if (state.token) payload.token = state.token;
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      let data;
      try { data = await res.json(); } catch { data = { ok: false, error: 'Bad response' }; }
      if (data && data.error === 'Session expired.') logout(true);
      return data;
    } catch {
      return { ok: false, error: 'Network error' };
    }
  }

  function readImageFile(file, maxSide = 1280, quality = 0.72) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) return reject(new Error('Not an image'));
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load fail')); };
      img.src = url;
    });
  }

      clearPendingImage();
      if (typeof data.streak === 'number') updateStreakUI(data.streak, data.speakersToday || 0);

        renderMessages();
        $('chat-messages').scrollTop = $('chat-messages').scrollHeight;

      $('btn-send').disabled = false;

  async function ownerOpenChat(chatId, title) {
    state.ownerChatId = chatId;
    $('oc-title').textContent = title || 'Chat';
    const data = await api('owner_get_chat', { ownerPassword: OWNER_PASSWORD, chatId });
    if (!data.ok) { toast(data.error || 'Failed'); return; }
    let streak = 0;
    const g = state.ownerGroups.find((x) => x.groupId === chatId);
    if (g) streak = g.streak || 0;
    $('oc-streak-val').value = streak;
    const box = $('oc-messages');
    const msgs = data.messages || [];
    if (!msgs.length) box.innerHTML = '<div class="empty">No messages</div>';
    else {
      box.innerHTML = msgs.map((m) => {
        const who = m.sender ? (m.sender.displayName || m.sender.username) : '?';
        const img = m.imageDataUrl
          ? '<br><img src="' + m.imageDataUrl + '" style="max-height:120px;border-radius:8px;margin-top:4px" />'
          : '';
        return '<div class="owner-chat-line"><div class="meta">' + esc(who) + ' ' +
          badge(m.sender && m.sender.verified) + ' · ' + timeStr(m.at) + '</div>' +
          esc(m.text || '') + img + '</div>';
      }).join('');
    }
    $('modal-owner-chat').classList.add('open');
  }

  $('oc-streak-save').onclick = async () => {
    if (!state.ownerChatId) return;
    const data = await api('owner_set_streak', {
      ownerPassword: OWNER_PASSWORD,
      chatId: state.ownerChatId,
      streak: parseInt($('oc-streak-val').value, 10) || 0,
    });
    if (!data.ok) { toast(data.error || 'Failed'); return; }
    toast('Streak set to ' + data.streak);
    loadOwnerData();
  };

  (async () => {
    if (state.token) {
      const data = await api('get_profile');
      if (data.ok) {
        state.profile = data.profile;
        state.myUserId = data.userId;
        await enterApp();
        return;
      }
      localStorage.removeItem('zc_token');
      state.token = null;
    }
  })();
})();
</script>
</body>
</html>
